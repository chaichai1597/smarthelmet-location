<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Smart Helmet GPS</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, "Noto Sans Thai", sans-serif;
    background: linear-gradient(135deg,#e3f2fd,#ffffff);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 450px;
    background: white;
    border-radius: 25px;
    padding: 30px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    text-align: center;
}

.logo {
    font-size: 60px;
}

h1 {
    color: #1565c0;
}

.status {
    margin: 15px 0;
    padding: 12px;
    border-radius: 12px;
    background: #eeeeee;
}

button {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 15px;
    background: #1976d2;
    color: white;
    font-size: 18px;
    font-weight: bold;
    margin-top: 10px;
}

button:active {
    transform: scale(0.98);
}

.location {
    display: none;
    margin-top: 20px;
    background: #f1f8e9;
    padding: 20px;
    border-radius: 15px;
    text-align: left;
}

.value {
    font-size: 18px;
    font-weight: bold;
    color: #1565c0;
    word-break: break-all;
}

.map {
    display: block;
    margin-top: 15px;
    padding: 14px;
    background: #43a047;
    color: white;
    text-decoration: none;
    text-align: center;
    border-radius: 12px;
    font-weight: bold;
}

.error {
    background: #ffebee;
    color: #d32f2f;
    padding: 15px;
    border-radius: 12px;
}

</style>

</head>

<body>

<div class="container">

<div class="logo">🪖</div>

<h1>Smart Helmet</h1>

<p>GPS สำรองจากโทรศัพท์</p>

<div id="bleStatus" class="status">
🔴 ยังไม่ได้เชื่อมต่อ ESP32
</div>

<button onclick="connectBLE()">
🔵 เชื่อมต่อ Smart Helmet
</button>

<button onclick="getLocation()">
📍 ทดสอบ GPS โทรศัพท์
</button>

<div id="status"></div>

<div id="location" class="location">

<p>Latitude</p>

<div id="lat" class="value"></div>

<p>Longitude</p>

<div id="lng" class="value"></div>

<p>ความแม่นยำ</p>

<div id="accuracy" class="value"></div>

<a id="map"
   class="map"
   target="_blank">

🗺️ เปิด Google Maps

</a>

</div>

</div>


<script>

// =====================================================
// BLE
// =====================================================

const SERVICE_UUID =
    "12345678-1234-1234-1234-1234567890ab";

const COMMAND_UUID =
    "12345678-1234-1234-1234-1234567890ac";

const LOCATION_UUID =
    "12345678-1234-1234-1234-1234567890ad";


let device = null;

let commandCharacteristic = null;

let locationCharacteristic = null;


// =====================================================
// เชื่อมต่อ ESP32
// =====================================================

async function connectBLE() {

    try {

        if (!navigator.bluetooth) {

            alert(
                "เบราว์เซอร์นี้ไม่รองรับ Bluetooth Web API"
            );

            return;
        }


        document.getElementById("bleStatus").innerHTML =
            "🟡 กำลังค้นหา ESP32...";


        device = await navigator.bluetooth.requestDevice({

            filters: [
                {
                    name: "SmartHelmet"
                }
            ],

            optionalServices: [
                SERVICE_UUID
            ]

        });


        const server =
            await device.gatt.connect();


        const service =
            await server.getPrimaryService(
                SERVICE_UUID
            );


        commandCharacteristic =
            await service.getCharacteristic(
                COMMAND_UUID
            );


        locationCharacteristic =
            await service.getCharacteristic(
                LOCATION_UUID
            );


        await locationCharacteristic.startNotifications();


        locationCharacteristic.addEventListener(
            "characteristicvaluechanged",
            handleESP32Command
        );


        document.getElementById("bleStatus").innerHTML =
            "🟢 เชื่อมต่อ ESP32 แล้ว";


    } catch(error) {

        console.log(error);

        document.getElementById("bleStatus").innerHTML =
            "🔴 เชื่อมต่อไม่สำเร็จ";

    }

}


// =====================================================
// รับคำสั่งจาก ESP32
// =====================================================

function handleESP32Command(event) {

    const decoder =
        new TextDecoder();

    const command =
        decoder.decode(
            event.target.value
        );


    console.log(
        "ESP32:",
        command
    );


    if (
        command === "GET_LOCATION"
    ) {

        document.getElementById("status").innerHTML =
            "📍 ESP32 ขอพิกัด กำลังค้นหา GPS โทรศัพท์...";


        getLocation();

    }

}


// =====================================================
// อ่าน GPS โทรศัพท์
// =====================================================

function getLocation() {

    const status =
        document.getElementById("status");

    const locationBox =
        document.getElementById("location");


    locationBox.style.display =
        "none";


    status.innerHTML =
        "⏳ กำลังค้นหาตำแหน่งโทรศัพท์...";


    if (!navigator.geolocation) {

        status.innerHTML = `
            <div class="error">
            ❌ โทรศัพท์ไม่รองรับ Location
            </div>
        `;

        return;
    }


    navigator.geolocation.getCurrentPosition(

        async function(position) {

            const latitude =
                position.coords.latitude;

            const longitude =
                position.coords.longitude;

            const accuracy =
                position.coords.accuracy;


            document.getElementById("lat").innerText =
                latitude.toFixed(6);


            document.getElementById("lng").innerText =
                longitude.toFixed(6);


            document.getElementById("accuracy").innerText =
                "ประมาณ "
                + accuracy.toFixed(1)
                + " เมตร";


            const mapURL =
                "https://www.google.com/maps?q="
                + latitude
                + ","
                + longitude;


            document.getElementById("map").href =
                mapURL;


            locationBox.style.display =
                "block";


            status.innerHTML =
                "✅ GPS โทรศัพท์พร้อมใช้งาน";


            // =========================================
            // ส่งพิกัดกลับ ESP32
            // =========================================

            if (
                commandCharacteristic
            ) {

                const data =
                    "LOCATION,"
                    + latitude.toFixed(6)
                    + ","
                    + longitude.toFixed(6);


                const encoder =
                    new TextEncoder();


                await commandCharacteristic.writeValue(
                    encoder.encode(data)
                );


                console.log(
                    "ส่งพิกัดไป ESP32:",
                    data
                );

            }

        },


        function(error) {

            let message =
                "ไม่สามารถรับ Location ได้";


            if (error.code === 1) {

                message =
                    "กรุณาอนุญาตให้เว็บไซต์ใช้ Location";

            }

            else if (error.code === 2) {

                message =
                    "ไม่สามารถหาตำแหน่งได้";

            }

            else if (error.code === 3) {

                message =
                    "ค้นหาตำแหน่งหมดเวลา";

            }


            status.innerHTML = `

                <div class="error">
                ❌ ${message}
                </div>

            `;

        },


        {

            enableHighAccuracy: true,

            timeout: 20000,

            maximumAge: 0

        }

    );

}

</script>

</body>

</html>
